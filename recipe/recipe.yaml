schema_version: 1

context:
  version: "0.196"

package:
  name: elfutils
  version: ${{ version }}

source:
  url: https://fedorahosted.org/releases/e/l/elfutils/${{ version }}/elfutils-${{ version }}.tar.bz2
  sha256: fd5cc6b77ad6773cac93cb3f415f9318ac3b3455eecf801f6b4a742c4f6c7209
  patches:
    - disable-werror.patch

build:
  number: 0
  skip: not linux

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - ${{ compiler('cxx') }}
    - pkg-config
    - make
    - gettext-tools
    - libtool
    - automake
    # libcpu expands its instruction tables with m4 while building, so this is
    # a build tool and must run on the build platform when cross-compiling.
    - m4
  host:
    - bzip2
    - libarchive
    - liblzma-devel
    - zlib
    - zstd
  run_exports:
    - ${{ pin_subpackage('elfutils', upper_bound='x.x') }}

tests:
  - script: run_test.sh
    files:
      recipe:
        - test_libdwarf.c
    requirements:
      run:
        - ${{ compiler('c') }}
        - pkg-config

about:
  license: LGPL-3.0-only
  license_file: COPYING-LGPLV3
  summary: a set of utilities and libraries for handling ELF (Executable and Linkable Format) files.
  homepage: https://fedorahosted.org/elfutils/

extra:
  recipe-maintainers:
    - edisongustavo
    - ehfd
    - xhochy
